name: Build SoundWave

on:
  push:
    branches: [main]
    paths:
      - main.dart
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: false

      - name: Create Flutter project
        run: |
          flutter create --org com.soundwave --project-name soundwave --platforms android app
          cp main.dart app/lib/main.dart

      - name: Add packages and patch the Android project
        working-directory: app
        run: |
          flutter pub add just_audio:^0.9.40 just_audio_background:^0.0.1-beta.13 file_picker:^8.1.2 path_provider:^2.1.4 path:^1.9.0 shared_preferences:^2.3.2 audio_metadata_reader:^1.8.1 permission_handler:^12.0.0 http:^1.2.2 open_filex:^4.6.0 youtube_explode_dart
          python3 - <<'PY'
          import os
          f = 'android/app/src/main/AndroidManifest.xml'
          s = open(f).read()
          perms = '''    <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
          '''
          svc = '''        <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true" tools:ignore="Instantiatable">
                      <intent-filter><action android:name="android.media.browse.MediaBrowserService"/></intent-filter>
                  </service>
                  <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true" tools:ignore="Instantiatable">
                      <intent-filter><action android:name="android.intent.action.MEDIA_BUTTON"/></intent-filter>
                  </receiver>
          '''
          s = s.replace('<application', perms + '    <application', 1)
          s = s.replace('</application>', svc + '    </application>', 1)
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          s = s.replace('android:label="soundwave"', 'android:label="SoundWave"')
          open(f, 'w').write(s)

          for root, _, files in os.walk('android/app/src/main'):
              for n in files:
                  if n.startswith('MainActivity'):
                      path = os.path.join(root, n)
                      pkg = [l for l in open(path) if l.startswith('package')][0].strip()
                      os.remove(path)
                      open(os.path.join(root, 'MainActivity.kt'), 'w').write(
                          pkg + '\n\nimport com.ryanheise.audioservice.AudioServiceActivity\n\nclass MainActivity : AudioServiceActivity()\n')
                      break

          kts = 'android/build.gradle.kts'
          gr = 'android/build.gradle'
          if os.path.exists(kts):
              fn = kts
              add = '''subprojects {
              afterEvaluate {
                  extensions.findByName("android")?.let {
                      (it as com.android.build.gradle.BaseExtension).compileSdkVersion(36)
                  }
              }
          }

          '''
          else:
              fn = gr
              add = '''subprojects {
              afterEvaluate { p ->
                  if (p.hasProperty('android')) { p.android { compileSdkVersion 36 } }
              }
          }

          '''
          t = open(fn).read()
          open(fn, 'w').write(add + t)
          print('patched', fn)
          PY

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore || { echo "Missing DEBUG_KEYSTORE_B64 secret"; exit 1; }

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --build-name=1.1.${{ github.run_number }} --build-number=$((100 + ${{ github.run_number }})) --dart-define=REPO=${{ github.repository }} --dart-define=BUILD=${{ github.run_number }}

      - name: Name the file
        run: cp app/build/app/outputs/flutter-apk/app-release.apk SoundWave.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: SoundWave 1.1.${{ github.run_number }}
          files: SoundWave.apk
